{% extends 'admin/base.html' %}{% block title %}Social profile{% endblock %}{% block content %}<div class="page-header"><div><span class="overline">SOCIAL PROFILE</span><h1>Edit fictional profile</h1><p>Change the identity and visible profile statistics.</p></div></div><section class="panel"><form method="post" enctype="multipart/form-data"><input type="hidden" name="_csrf_token" value="{{ csrf_token }}"><div class="two-col"><label>Full name<input name="name" value="{{ profile.name }}" required></label><label>Username<input name="username" value="{{ profile.username }}"></label></div><label>Biography<textarea name="bio" rows="3">{{ profile.bio }}</textarea></label><div class="two-col"><label>City<input name="city" value="{{ profile.city }}"></label><label>Workplace<input name="workplace" value="{{ profile.workplace }}"></label><label>Education<input name="education" value="{{ profile.education }}"></label><label>Followers<input name="followers" type="number" min="0" value="{{ profile.followers }}"></label><label>Friends count<input name="friends_count" type="number" min="0" value="{{ profile.friends_count }}"></label></div><div class="two-col"><label>Profile picture<input type="file" name="profile_image" accept="image/*">{% if profile.profile_image %}<img class="preview" src="{{ url_for('admin.media',filename=profile.profile_image) }}" alt="Profile picture">{% endif %}</label><label>Cover photo<input type="file" name="cover_image" accept="image/*">{% if profile.cover_image %}<img class="preview" src="{{ url_for('admin.media',filename=profile.cover_image) }}" alt="Cover photo">{% endif %}</label></div><button class="button">Save profile</button></form></section>{% endblock %}
