{% extends 'admin/base.html' %}{% block title %}Company settings{% endblock %}{% block content %}<div class="page-header"><div><span class="overline">CONFIGURATION</span><h1>Company settings</h1><p>Brand the fictional employee portal.</p></div></div><section class="panel"><form method="post" enctype="multipart/form-data"><input type="hidden" name="_csrf_token" value="{{ csrf_token }}"><label>Company name<input name="company_name" value="{{ settings.get('company_name','') }}" required></label><label>Portal tagline<input name="company_tagline" value="{{ settings.get('company_tagline','') }}"></label><label>Login notice<textarea name="login_notice" rows="3">{{ settings.get('login_notice','') }}</textarea></label><label>Company logo (optional image)<input type="file" name="company_logo" accept="image/png,image/jpeg,image/webp,image/gif"></label>{% if settings.get('company_logo') %}<img class="preview" src="{{ url_for('admin.media',filename=settings['company_logo']) }}" alt="Current logo">{% endif %}<button class="button">Save changes</button></form></section>{% endblock %}
