<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Admin sign in</title><link rel="stylesheet" href="{{ url_for('static',filename='css/admin.css') }}"></head><body><main class="auth"><div class="auth-card"><div class="logo large">◈</div><h1>Challenge Studio</h1><p>Private administrator login</p>{% with msgs=get_flashed_messages(with_categories=true) %}{% for kind,msg in msgs %}<div class="flash {{kind}}">{{msg}}</div>{% endfor %}{% endwith %}<form method="post"><input type="hidden" name="_csrf_token" value="{{ csrf_token }}"><label>Username<input name="username" autocomplete="username" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button class="button">Sign in</button></form><a class="back" href="{{ url_for('index') }}">← Return to challenge</a></div></main></body></html>
